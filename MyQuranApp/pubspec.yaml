name: my_quran_app
description: "تطبيق تذكرة القرآني"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran_data.json
    - assets/audio/
  fonts:
    - family: ArabicFont
      fonts:
        - asset: assets/arabic.ttf